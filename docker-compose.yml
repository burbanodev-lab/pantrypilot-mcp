services:
  pantrypilot-mcp:
    build: .
    ports:
      - "3000:3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      # Include compose hostname / localhost for Host header validation
      ALLOWED_HOSTS: "localhost,127.0.0.1,::1,pantrypilot-mcp"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
