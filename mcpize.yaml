# mcpize.yaml — PantryPilot for MCPize marketplace
version: 1
name: pantrypilot
description: |
  Agentic kitchen MCP: durable SQLite pantry → meal plan → shop list → draft cart.
  Prefer kitchen_run for the full agent loop. Protocol 2025-11-25 Streamable HTTP.
  Set DATABASE_PATH for the SQLite file (default ./data/pantrypilot.sqlite).

runtime: typescript
entry: src/server.ts

build:
  install: npm ci
  command: npm run build

startCommand:
  type: http
  command: node dist/server.js

# Pricing configured in MCPize dashboard (free tier + paid)
