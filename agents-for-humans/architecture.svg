<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">PantryPilot Strands architecture</title>
  <desc id="desc">Human request flows into a Strands Agent, through a Strands MCP client to PantryPilot MCP tools, household state, safety gates, optional Bedrock meal planning and mock product/cart services.</desc>
  <rect width="1400" height="760" fill="#ffffff"/>
  <style>
    .box { fill:#f8fafc; stroke:#111827; stroke-width:2; rx:18; }
    .core { fill:#eef2ff; stroke:#3730a3; stroke-width:3; rx:18; }
    .safe { fill:#ecfdf5; stroke:#047857; stroke-width:2; rx:18; }
    .ext { fill:#fff7ed; stroke:#c2410c; stroke-width:2; rx:18; }
    .t { font-family: Arial, Helvetica, sans-serif; fill:#111827; text-anchor:middle; }
    .h { font-size:28px; font-weight:700; }
    .s { font-size:20px; }
    .m { font-size:17px; }
    .arrow { stroke:#374151; stroke-width:3; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="700" y="55" class="t h">PantryPilot Strands — Agents for Humans</text>
  <text x="700" y="88" class="t s">Strands owns reasoning and tool orchestration; MCP owns deterministic household capabilities.</text>

  <rect x="70" y="270" width="220" height="120" class="box"/>
  <text x="180" y="315" class="t h">Human</text>
  <text x="180" y="350" class="t m">one household goal</text>

  <rect x="360" y="220" width="300" height="220" class="core"/>
  <text x="510" y="270" class="t h">Strands Agent</text>
  <text x="510" y="308" class="t m">@strands-agents/sdk 1.17.0</text>
  <text x="510" y="338" class="t m">model-driven loop</text>
  <text x="510" y="368" class="t m">sequential tool executor</text>
  <text x="510" y="398" class="t m">surfaces only real decisions</text>

  <rect x="730" y="245" width="260" height="170" class="core"/>
  <text x="860" y="292" class="t h">Strands McpClient</text>
  <text x="860" y="330" class="t m">native MCP tool provider</text>
  <text x="860" y="360" class="t m">Streamable HTTP</text>
  <text x="860" y="390" class="t m">discovery + invocation</text>

  <rect x="1060" y="180" width="280" height="300" class="box"/>
  <text x="1200" y="225" class="t h">PantryPilot MCP</text>
  <text x="1200" y="265" class="t m">pantry_upsert / query</text>
  <text x="1200" y="295" class="t m">prefs_set / get</text>
  <text x="1200" y="325" class="t m">meal_plan</text>
  <text x="1200" y="355" class="t m">shop_list_build</text>
  <text x="1200" y="385" class="t m">product_search</text>
  <text x="1200" y="415" class="t m">cart_draft / recall</text>
  <text x="1200" y="445" class="t m">kitchen_run</text>

  <rect x="980" y="565" width="220" height="110" class="safe"/>
  <text x="1090" y="605" class="t s">SQLite state</text>
  <text x="1090" y="638" class="t m">persistent household memory</text>

  <rect x="1210" y="565" width="160" height="110" class="safe"/>
  <text x="1290" y="605" class="t s">Safety gates</text>
  <text x="1290" y="638" class="t m">allergy + budget</text>

  <rect x="705" y="565" width="220" height="110" class="ext"/>
  <text x="815" y="605" class="t s">Amazon Bedrock</text>
  <text x="815" y="638" class="t m">optional model path</text>

  <rect x="425" y="565" width="220" height="110" class="ext"/>
  <text x="535" y="605" class="t s">Mock catalog/cart</text>
  <text x="535" y="638" class="t m">reversible, no payment</text>

  <path d="M290 330 L350 330" class="arrow"/>
  <path d="M660 330 L720 330" class="arrow"/>
  <path d="M990 330 L1050 330" class="arrow"/>
  <path d="M1170 480 L1100 555" class="arrow"/>
  <path d="M1225 480 L1280 555" class="arrow"/>
  <path d="M1110 480 L850 555" class="arrow"/>
  <path d="M1075 480 L590 555" class="arrow"/>

  <text x="700" y="725" class="t m">Routine work completes autonomously; constraints and irreversible actions return control to the person.</text>
</svg>
