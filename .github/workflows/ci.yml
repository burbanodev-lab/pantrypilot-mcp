name: PantryPilot CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pantrypilot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Judge readiness checks
        run: npm run judge-check
        env:
          # Keep CI deterministic and credential-free. Live Bedrock is exercised
          # only in the separately documented AWS demo path.
          BEDROCK_ENABLED: "false"

      - name: Offline evaluation suite
        run: npm run eval
        env:
          BEDROCK_ENABLED: "false"
